<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeAIPay</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
      (function() {
        var segmentStart = '/ChangeAIPayApp/';
        var path = window.location.pathname;
        var search = window.location.search;
        
        // If we're already at the root, don't redirect
        if (path === '/ChangeAIPayApp/' || path === '/ChangeAIPayApp') {
          return;
        }
        
        // Extract the path after /ChangeAIPayApp/
        var redirectPath = '';
        if (path.indexOf('/ChangeAIPayApp/') === 0) {
          redirectPath = path.substring('/ChangeAIPayApp/'.length - 1);
        } else if (path === '/' || path === '') {
          redirectPath = '/';
        } else {
          redirectPath = path;
        }
        
        // Ensure it starts with /
        if (!redirectPath.startsWith('/')) {
          redirectPath = '/' + redirectPath;
        }
        
        // Redirect to the main index.html with the path preserved
        var redirectUrl = '/ChangeAIPayApp/' + redirectPath + window.location.search;
        window.location.replace(redirectUrl);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeAIPay</title>
    <meta name="robots" content="noindex, nofollow">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // This page redirects to the main app
      window.location.replace('/ChangeAIPayApp/' + window.location.pathname.replace(/^\/ChangeAIPayApp/, '') + window.location.search);
    </script>
  </body>
</html>
